<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>무협</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#05070a;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
    -webkit-user-select:none;user-select:none;}
  #cv{position:fixed;display:block;image-rendering:pixelated;background:#0e1116;}
  #ui{position:fixed;pointer-events:none;overflow:hidden;}

  #card{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 8px);
    transition:opacity .22s;
    background:rgba(13,16,21,.86);border:1.5px solid #262e38;border-radius:12px;padding:8px 10px 7px;}
  .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
    font-size:12px;font-weight:900;color:#e8eef6;letter-spacing:.05em;}
  .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
    font-size:11px;font-weight:900;letter-spacing:.05em;}
  .row2 #realm{color:#9fd0ff;pointer-events:auto;cursor:pointer;
    border-bottom:1px dotted #4a6a88;padding-bottom:1px;}
  .row2 #silver{color:#e8c96a;font-variant-numeric:tabular-nums;display:flex;
    align-items:center;gap:4px;}
  .coin{width:14px;height:9px;image-rendering:pixelated;vertical-align:-1px;}
  .bar{position:relative;height:13px;margin-bottom:5px;border-radius:7px;overflow:hidden;
    background:#0a0d12;border:1.5px solid #222932;}
  .bar>i{display:block;height:100%;width:0%;transition:width .12s linear;}
  #hp>i{background:linear-gradient(90deg,#c8453c,#e0655a);}
  #kn>i{background:linear-gradient(90deg,#3f7fb8,#69a8dd);}
  .bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);letter-spacing:.04em;}

  /* 하단 탭바 — 기능이 들어올 때마다 탭이 하나씩 는다 */
  #ui{--tabh:calc(env(safe-area-inset-bottom) + 52px);}
  #tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);
    padding-bottom:env(safe-area-inset-bottom);display:flex;pointer-events:auto;
    background:rgba(13,16,21,.96);border-top:1.5px solid #262e38;transition:opacity .22s;}
  #tabs button{flex:1;position:relative;background:none;border:0;color:#7f8b99;
    font:900 13px/1 inherit;letter-spacing:.08em;}
  #tabs button.on{color:#eaf3ff;}
  #tabs button .dot{position:absolute;top:9px;right:calc(50% - 24px);width:6px;height:6px;
    border-radius:50%;background:#e8c96a;display:none;}
  #tabs button .dot.on{display:block;}
  /* [테스트 전용] 시험 버튼·패널 — TEST 끄면 안 보인다. 출시 전에 걷어낸다 */
  #tbtn{position:absolute;left:10px;bottom:calc(var(--tabh) + 10px);transition:opacity .22s;
    pointer-events:auto;background:rgba(32,24,20,.92);border:1.5px solid #5a4438;
    border-radius:10px;color:#e0c8a8;font:900 13px/1 inherit;padding:11px 16px;letter-spacing:.05em;
    display:none;}
  #tbtn.on{display:block;}
  #tbtn:active{background:#7a5238;}
  #tspd{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
  /* overflow:hidden — 닫힌 시트(아래로 밀린 상태)가 컨테이너 밖 탭바 위로 삐져나오지 않게 */
  #zpanel,#tpanel,#trpanel,#rpanel,#apanel{position:absolute;inset:0 0 var(--tabh) 0;pointer-events:none;
    overflow:hidden;background:rgba(6,8,11,0);transition:background .2s;display:flex;align-items:flex-end;}
  #zpanel.show,#tpanel.show,#trpanel.show,#rpanel.show,#apanel.show{pointer-events:auto;background:rgba(6,8,11,.72);}
  .zsheet{width:100%;background:#12161c;border-top:1.5px solid #2b333d;
    border-radius:16px 16px 0 0;padding:0 0 calc(env(safe-area-inset-bottom) + 14px);
    transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.3,1);
    max-height:76%;overflow:auto;}
  #zpanel.show .zsheet,#tpanel.show .zsheet,#trpanel.show .zsheet,#rpanel.show .zsheet,#apanel.show .zsheet{transform:translateY(0);}
  /* 수련 패널 줄 */
  /* 배수 토글은 스크롤해도 위에 붙어 있는다 (스탯창 보기 불편 피드백) */
  .zst.tramt{position:sticky;top:44px;z-index:2;background:#12161c;
    margin:0;padding:9px 12px 8px;border-bottom:1px solid #1e242c;}
  .trow{display:flex;align-items:center;gap:10px;}
  .trl{flex:1;min-width:0;}
  .trbuy{flex:0 0 auto;min-width:74px;background:#23303e;border:1.5px solid #3c6f9e;
    border-radius:9px;color:#cfe4f8;font:900 12px/1.35 inherit;padding:8px 10px;
    letter-spacing:.03em;font-variant-numeric:tabular-nums;}
  .trbuy i{font-style:normal;font-size:9px;color:#8fb4d8;display:block;}
  .trbuy:active{background:#2f5f8c;}
  .trbuy[disabled]{background:#171d25;border-color:#232b35;color:#57616d;}
  .trbuy[disabled] i{color:#48525d;}
  #trsilver{font-size:11px;color:#e8c96a;font-weight:900;font-variant-numeric:tabular-nums;}
  /* 무공 패널 — 문파별 타일 그리드 + 상세 칸 */
  .agrid{display:flex;flex-wrap:wrap;gap:6px;margin:4px 12px 0;}
  .atile{position:relative;width:56px;height:50px;border-radius:10px;border:1.5px solid #2c3540;
    background:#171d25;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;color:#9fb0c2;padding:0;overflow:hidden;}
  .atile .sc{position:absolute;top:0;left:9px;right:9px;height:3px;border-radius:0 0 3px 3px;}
  .atile .g{font-size:17px;font-weight:900;}
  .atile .nm{font-size:8px;font-weight:800;color:#8b97a5;}
  /* 배움/안 배움을 확실히 가른다 — 익힌 건 문파색 바탕, 안 익힌 건 흑백(피드백) */
  .atile.got .nm{color:#cfe0f2;}
  .atile:not(.got) .g{filter:grayscale(1);opacity:.55;}
  .atile.lock{opacity:.35;}
  .atile.fate{border-style:dashed;border-color:#8a6d2f;}
  .atile.sel{outline:2px solid #4a86bd;outline-offset:1px;}
  /* 우상단 배지 — ▲ 돌파 가능(금색) · + 배울 수 있음(청록) */
  .atile .bd{position:absolute;top:1px;right:3px;font-style:normal;font-size:9px;
    font-weight:900;line-height:1;display:none;}
  .atile .bd.up{display:block;color:#e8c96a;animation:bdp 1.1s ease-in-out infinite;}
  .atile .bd.can{display:block;color:#6fd3a8;}
  .atile .bd.lv{display:block;color:#69a8dd;}
  @keyframes bdp{50%{transform:scale(1.35);}}
  .adet{margin:8px 12px 0;padding:10px 14px;background:#171d25;border:1.5px solid #3c6f9e;
    border-radius:11px;}
  .adet .trbuy{margin-top:8px;}
  .zn small{font-size:10px;color:#5d6773;font-weight:700;margin-left:3px;}
  .zn .sch{font-style:normal;font-size:9px;font-weight:800;margin-left:4px;
    padding:1.5px 5px;border:1px solid currentColor;border-radius:5px;opacity:.85;}
  .zn em.fate{color:#e8c96a;}
  .zd.need{color:#7a97b5;margin-top:3px;}
  .znote.asec{margin-top:9px;font-size:11px;color:#8b97a5;font-weight:900;letter-spacing:.06em;}
  .zhd{position:sticky;top:0;background:#12161c;display:flex;justify-content:space-between;
    align-items:center;padding:14px 16px 10px;font-size:14px;font-weight:900;color:#e8eef6;
    letter-spacing:.06em;border-bottom:1px solid #1e242c;}
  .zhd button{background:none;border:0;color:#7f8b99;font-size:17px;padding:2px 6px;}
  .zrow{margin:8px 12px;padding:12px 14px;background:#171d25;border:1.5px solid #232b35;
    border-radius:11px;}
  .zrow.on{border-color:#3c6f9e;background:#1a2430;}
  .zrow.lock{opacity:.42;}
  .zn{font-size:14px;font-weight:900;color:#e8eef6;letter-spacing:.05em;}
  .zn em{font-style:normal;font-size:10px;color:#69a8dd;font-weight:800;margin-left:5px;}
  .zd{font-size:11px;color:#8b97a5;margin-top:4px;line-height:1.45;}
  .zst{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
  .sb{flex:0 0 auto;min-width:30px;background:#1e252e;border:1px solid #2c3540;
    border-radius:6px;color:#9fb0c2;font:800 11px/1 inherit;padding:6px 0;}
  .sb.on{background:#2f5f8c;border-color:#4a86bd;color:#eaf3ff;}
  .sb.bs{min-width:38px;background:#2e1c1a;border-color:#5a3330;color:#e0a094;}
  .sb.bs.on{background:#8c3f2f;border-color:#bd6a4a;color:#ffeee8;}
  .znote{margin:6px 14px 4px;font-size:10px;color:#5d6773;line-height:1.5;}

  #opanel,#fpanel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;background:rgba(6,8,11,.66);transition:opacity .2s;}
  #opanel.show,#fpanel.show{pointer-events:auto;opacity:1;}
  .fcard{border-color:#8a6d2f;}
  .fcard .oh{color:#e8c96a;}
  #ftitle{font-size:14px;font-weight:900;color:#e8eef6;margin-top:9px;letter-spacing:.05em;}
  #ftext{font-size:11.5px;color:#9fb0c2;margin-top:7px;line-height:1.7;}
  #ftext b{color:#e8c96a;}
  .ocard{background:#12161c;border:1.5px solid #2b333d;border-radius:14px;
    padding:18px 22px 16px;min-width:232px;text-align:center;}
  .oh{font-size:15px;font-weight:900;color:#f0e2b8;letter-spacing:.08em;}
  #otime{font-size:11px;color:#8b97a5;margin-top:6px;}
  .orow{display:flex;justify-content:space-between;gap:22px;margin-top:9px;
    font-size:12px;color:#9fb0c2;}
  .orow b{color:#e8eef6;font-weight:900;}
  #obody{margin-top:5px;border-top:1px solid #1e242c;padding-top:4px;}
  #obtn{margin-top:15px;width:100%;background:#2f5f8c;border:1.5px solid #4a86bd;
    border-radius:9px;color:#eaf3ff;font:900 13px/1 inherit;padding:11px 0;letter-spacing:.06em;}
  #obtn:active{background:#3c6f9e;}

  #toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(12,15,20,.92);border:1.5px solid #3a4553;border-radius:10px;
    padding:10px 20px;font-size:15px;font-weight:900;color:#f0e2b8;letter-spacing:.06em;
    opacity:0;transition:opacity .18s,transform .18s;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="card">
    <div class="row1"><span id="stage">죽림 1단계</span><span id="kills">0 / 10</span></div>
    <div class="bar" id="hp"><i></i><span id="hpt"></span></div>
    <div class="bar" id="kn"><i></i></div>
    <div class="row2"><span id="realm"></span><span id="silver"><img class="coin" id="coinhud"><b id="silvern">0</b></span></div>
  </div>
  <div id="toast"></div>
  <div id="tabs">
    <button id="tab-arts">무공<i class="dot"></i></button>
    <button id="tab-train">수련<i class="dot"></i></button>
    <button id="tab-zone">사냥터</button>
  </div>
  <div id="apanel">
    <div class="zsheet">
      <div class="zhd">무공<button id="aclose">✕</button></div>
      <div id="abody"></div>
    </div>
  </div>
  <div id="rpanel">
    <div class="zsheet">
      <div class="zhd">경지<button id="rclose">✕</button></div>
      <div id="rbody"></div>
    </div>
  </div>
  <div id="trpanel">
    <div class="zsheet">
      <div class="zhd">수련<span id="trsilver"></span><button id="trclose">✕</button></div>
      <div id="trbody"></div>
    </div>
  </div>
  <button id="tbtn">시험</button><!-- [테스트 전용] -->
  <!-- [테스트 전용] 시험 패널 — 배속·강제 쓰러짐·저장 초기화 -->
  <div id="tpanel">
    <div class="zsheet">
      <div class="zhd">테스트<button id="tclose">✕</button></div>
      <div class="zrow">
        <div class="zn">배속</div>
        <div id="tspd"></div>
      </div>
      <div class="zrow">
        <div class="zn">동작</div>
        <div class="zst">
          <button class="sb" id="tdown" style="padding:6px 10px">강제 쓰러짐</button>
          <button class="sb bs" id="treset" style="padding:6px 10px">저장 초기화</button>
        </div>
      </div>
      <div class="znote">테스트 전용 — TEST를 끄면 이 패널과 시험 버튼이 사라진다.</div>
    </div>
  </div>

  <div id="zpanel">
    <div class="zsheet">
      <div class="zhd">사냥터<button id="zclose">✕</button></div>
      <div id="zbody"></div>
    </div>
  </div>
  <div id="fpanel">
    <div class="ocard fcard">
      <div class="oh">기연 奇緣</div>
      <div id="ftitle"></div>
      <div id="ftext"></div>
      <button id="fbtn" class="trbuy" style="width:100%;margin-top:14px">받아들인다</button>
    </div>
  </div>
  <div id="opanel">
    <div class="ocard">
      <div class="oh">운기조식을 마쳤다</div>
      <div id="otime"></div>
      <div id="obody"></div>
      <button id="obtn">수련 계속</button>
    </div>
  </div>
</div>
<script>/*ASSETS*/</script>
<script>/*CODE*/</script>
</body></html>
