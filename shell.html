<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>무협</title>
<!-- 한글 게임 폰트 (v2.42): Jua=둥글고 친근한 제목·본문(메이플 느낌 대체),
     Do Hyeon=수치 폴백. 온라인이면 로드되고 오프라인이면 시스템 폰트로 대체된다.
     (v2.40의 붓글씨 Gugi는 "폰트 구림" 피드백으로 교체) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --fb:'Jua','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif; /* 본문·수치 */
    --fw:'Jua','Do Hyeon','Apple SD Gothic Neo',sans-serif;                       /* 제목 */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#05070a;overflow:hidden;
    font-family:var(--fb);
    -webkit-user-select:none;user-select:none;}
  #cv{position:fixed;display:block;image-rendering:pixelated;background:#0e1116;}
  #ui{position:fixed;pointer-events:none;overflow:hidden;}

  #card{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 8px);
    transition:opacity .22s;
    background:rgba(13,16,21,.86);border:1.5px solid #262e38;border-radius:12px;padding:8px 10px 7px;}
  .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
    font-family:var(--fw);font-size:15px;color:#e8eef6;letter-spacing:.03em;}
  .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
    font-size:13px;font-weight:900;letter-spacing:.03em;}
  .row2 #realm{color:#9fd0ff;pointer-events:auto;cursor:pointer;
    border-bottom:1px dotted #4a6a88;padding-bottom:1px;}
  .row2 #silver{color:#e8c96a;font-variant-numeric:tabular-nums;display:flex;
    align-items:center;gap:4px;}
  .coin{width:12px;height:12px;image-rendering:pixelated;vertical-align:-2px;}
  .bar{position:relative;height:13px;margin-bottom:5px;border-radius:7px;overflow:hidden;
    background:#0a0d12;border:1.5px solid #222932;}
  .bar>i{display:block;height:100%;width:0%;transition:width .12s linear;}
  #hp>i{background:linear-gradient(90deg,#c8453c,#e0655a);}
  #kn>i{background:linear-gradient(90deg,#3f7fb8,#69a8dd);}
  .bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);letter-spacing:.04em;}

  /* 하단 탭바 — 기능이 들어올 때마다 탭이 하나씩 는다 */
  #ui{--tabh:calc(env(safe-area-inset-bottom) + 52px);}
  #tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);
    padding-bottom:env(safe-area-inset-bottom);display:flex;pointer-events:auto;
    background:rgba(13,16,21,.96);border-top:1.5px solid #262e38;transition:opacity .22s;}
  #tabs button{flex:1;position:relative;background:none;border:0;color:#7f8b99;
    font:400 12px/1 var(--fw);letter-spacing:.06em;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;}
  /* 탭 아이콘 (v2.63.4) — 안 켜진 탭은 흐리게, 켜지면 또렷하게 */
  #tabs button .ti{width:26px;height:26px;object-fit:contain;opacity:.55;filter:saturate(.6);transition:opacity .15s;}
  #tabs button.on{color:#eaf3ff;}
  #tabs button.on .ti{opacity:1;filter:none;}
  #tabs button .dot{position:absolute;top:9px;right:calc(50% - 24px);width:6px;height:6px;
    border-radius:50%;background:#e8c96a;display:none;}
  #tabs button .dot.on{display:block;}
  /* [테스트 전용] 시험 버튼·패널 — TEST 끄면 안 보인다. 출시 전에 걷어낸다 */
  /* 스킬창 — 익힌 초식의 쿨다운 표시 (자동 시전이라 누르는 게 아니다).
     버튼이 아니라 "기운이 차는 원판"처럼 보이게: 둥근 원, 눌리는 테두리 없음.
     쿨 도는 동안엔 초 숫자만 크게, 다 차면 한자 글자가 밝아진다 (겹침 방지). */
  /* 스킬 툴팁 (v2.63.6) — 스킬창 바로 위 */
  #stip{position:absolute;right:10px;bottom:calc(var(--tabh) + 58px);max-width:230px;pointer-events:none;
    background:rgba(13,16,21,.94);border:1.5px solid #3d5a7a;border-radius:9px;padding:7px 10px;
    font-size:11.5px;line-height:1.5;color:#c9d6e3;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;}
  #stip.show{opacity:1;transform:none;}
  #stip b{font-family:var(--fw);font-size:14px;color:#eaf3ff;letter-spacing:.04em;}
  #stip i{font-style:normal;color:#8b97a5;font-size:11px;}
  #stip .stfx{color:#9fd0ff;margin-top:2px;}
  #sbar{position:absolute;right:10px;bottom:calc(var(--tabh) + 10px);display:flex;gap:7px;
    align-items:flex-end;transition:opacity .22s;pointer-events:none;}
  /* 오토/수동 토글 — 스킬창 왼쪽 끝. 패널이 감춰도 늘 누를 수 있다 (v2.51 단장) */
  #sbar .smode{pointer-events:auto;align-self:flex-end;height:40px;padding:0 13px;
    display:flex;align-items:center;gap:6px;border-radius:20px;
    border:1.5px solid rgba(120,140,165,.32);background:linear-gradient(#1b232e,#12161c);
    color:#a9bccf;font:800 12px/1 inherit;letter-spacing:.04em;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.42);transition:color .15s,border-color .15s,box-shadow .15s;}
  #sbar .smode::before{content:'';width:7px;height:7px;border-radius:50%;
    background:currentColor;box-shadow:0 0 5px currentColor;opacity:.9;}
  #sbar .smode.man{border-color:#e0b25a;color:#f2d38c;background:linear-gradient(#2b2416,#1b1710);
    box-shadow:0 0 9px rgba(224,178,90,.28),0 2px 6px rgba(0,0,0,.42);}
  /* 초식 슬롯 — 입체 원판. 쿨은 시계 방향 원형 스윕, 준비되면 문파색 발광 */
  .sk{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;
    color:#e6edf5;font:900 17px/1 inherit;display:flex;align-items:center;justify-content:center;
    box-sizing:border-box;
    background:radial-gradient(circle at 50% 32%,#2a3444,#11151b 76%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 2px rgba(120,140,165,.24),
      0 2px 6px rgba(0,0,0,.5);}
  .sk .g{position:relative;z-index:2;opacity:1;transition:opacity .15s;
    text-shadow:0 1px 2px rgba(0,0,0,.55);}
  /* 쿨다운 원형 스윕 — JS가 conic-gradient 각도를 채운다 */
  .sk .gi{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;z-index:1;object-fit:cover;pointer-events:none;}
  .sk .cdm{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
    background:conic-gradient(rgba(7,10,15,.72) 0deg,rgba(7,10,15,0) 0deg);}
  .sk .cds{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:900 16px/1 inherit;color:#f2f7ff;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.9);
    font-variant-numeric:tabular-nums;}
  .sk.cooling .g{opacity:0;}                    /* 쿨 중엔 숫자만 (한자 겹침 방지) */
  .sk.rdy{background:radial-gradient(circle at 50% 32%,#313d50,#141a22 76%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 2px currentColor,
      0 0 11px 1px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.5);}
  /* 수동 모드에서 준비된 초식 — 누를 수 있고, 눈에 띄게 맥동한다 */
  .sk.tap{pointer-events:auto;cursor:pointer;animation:sktap 1.2s ease-in-out infinite;}
  @keyframes sktap{0%,100%{box-shadow:inset 0 0 0 2px currentColor,0 0 7px 1px rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.5);}
    50%{box-shadow:inset 0 0 0 2px currentColor,0 0 16px 4px rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.5);}}
  @media (prefers-reduced-motion: reduce){.sk.tap{animation:none;}}
  #tbtn{position:absolute;left:10px;top:50%;transform:translateY(-50%);transition:opacity .22s;   /* v2.68.1 화면 가운데 왼쪽 — 패널·스킬창과 안 겹치게 */
    pointer-events:auto;background:rgba(32,24,20,.92);border:1.5px solid #5a4438;
    border-radius:10px;color:#e0c8a8;font:900 13px/1 inherit;padding:11px 16px;letter-spacing:.05em;
    display:none;}
  #tbtn.on{display:block;}
  #tbtn.hide{opacity:0;pointer-events:none;}   /* 패널이 열리면 숨긴다 (겹침) — 60-ui hud()가 토글 (:has는 구형 크로뮴에서 안 먹혔다) */
  #tbtn:active{background:#7a5238;}
  #tspd{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
  /* overflow:hidden — 닫힌 시트(아래로 밀린 상태)가 컨테이너 밖 탭바 위로 삐져나오지 않게 */
  #zpanel,#tpanel,#trpanel,#rpanel,#apanel,#dpanel,#epanel{position:absolute;inset:0 0 var(--tabh) 0;pointer-events:none;
    overflow:hidden;background:rgba(6,8,11,0);transition:background .2s;display:flex;align-items:flex-end;}
  #zpanel.show,#tpanel.show,#trpanel.show,#rpanel.show,#apanel.show,#dpanel.show,#epanel.show{pointer-events:auto;background:rgba(6,8,11,.72);}
  .zsheet{width:100%;background:#12161c;border-top:1.5px solid #2b333d;
    border-radius:16px 16px 0 0;padding:0 0 calc(env(safe-area-inset-bottom) + 14px);
    transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.3,1);
    max-height:76%;overflow:auto;}
  #zpanel.show .zsheet,#tpanel.show .zsheet,#trpanel.show .zsheet,#rpanel.show .zsheet,#apanel.show .zsheet,#dpanel.show .zsheet,#epanel.show .zsheet{transform:translateY(0);}
  /* 장비 패널 (v2.70 표준형) — 탭 · 낀 것 · 일괄 합성/자동 장착 · 등급별 아이템 카드 · 상세 */
  .eqrow{display:flex;align-items:center;gap:10px;}
  .eqrow #equnwear{margin-left:auto;flex:0 0 auto;}   /* 무기 벗기 · 맨손 (v2.76.9) */
  .eqico{position:relative;width:48px;height:48px;flex:none;background:#0e1319;border:1.5px solid #2b333d;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .eqico img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;}
  .eqico b{position:absolute;right:-5px;bottom:-6px;font-size:9.5px;background:#12161c;border:1px solid #2b333d;border-radius:6px;padding:1px 4px;color:#cfe0f2;}
  .eqsl{color:#8b97a5;font-size:12px;}
  #etabs{position:sticky;top:0;z-index:3;display:flex;gap:6px;align-items:center;background:#12161c;padding:9px 12px 8px;border-bottom:1px solid #1e242c;}
  #eqcnt{margin-left:auto;font-size:11.5px;color:#8b97a5;}
  #epanel.show .zsheet{max-height:92%;}
  #zpanel.show .zsheet{max-height:92%;}   /* 지도 아래 단계 줄까지 다 보이게 (v2.70.4, 사용자) */
  .eqtop{margin-bottom:6px;}
  .eqbtns{display:flex;gap:6px;margin:0 12px 4px;}
  .eqbtns .sb{flex:1;padding:9px 0;font-size:12.5px;}
  .eqbtns .sb.on{background:#2f5f8c;border-color:#4a86bd;color:#eaf3ff;}
  .eqsec{margin:8px 12px 4px;font-family:var(--fw);font-size:13.5px;letter-spacing:.04em;}
  .eqsec i{font-style:normal;font-size:10.5px;color:#7f8b99;margin-left:6px;}
  .eqcards{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 12px;}
  .eqcard{position:relative;aspect-ratio:1;border-radius:9px;border:1.5px solid #232b35;background:#0e1319;padding:0;display:flex;align-items:center;justify-content:center;}
  .eqcard img{width:70%;height:70%;object-fit:contain;image-rendering:pixelated;filter:grayscale(1) brightness(.45);}
  .eqcard.seen{border-color:var(--gc);}
  .eqcard.seen img{filter:grayscale(1) brightness(.7);}
  .eqcard.have{background:color-mix(in srgb,var(--gc) 26%,#0e1319);}
  .eqcard.have img{filter:none;}
  .eqcard.worn{box-shadow:0 0 0 2px var(--gc) inset,0 0 8px color-mix(in srgb,var(--gc) 60%,transparent);}
  .eqcard.sel{outline:2px solid #eaf3ff;outline-offset:1px;}
  .eqcard em{position:absolute;left:2px;top:1px;font-style:normal;font-size:8.5px;color:#cfe0f2;text-shadow:0 1px 2px #000;}
  .eqcard b{position:absolute;right:2px;bottom:1px;font-size:9.5px;color:#fff;text-shadow:0 1px 2px #000;}
  .eqcard i{position:absolute;left:0;right:0;bottom:1px;font-style:normal;font-size:8px;color:var(--gc);font-weight:900;text-shadow:0 1px 2px #000;}
  .eqcard s{position:absolute;right:1px;top:0;text-decoration:none;font-size:8.5px;font-weight:900;color:#0a0d12;background:#e8c96a;border-radius:4px;padding:0 3px;}
  .eqdet{margin:10px 12px 4px;padding:10px 14px;background:#171d25;border:1.5px solid #3c6f9e;border-radius:11px;}
  .eqdet .zn small{font-size:11px;color:#8b97a5;margin-left:4px;}
  .eqdet .zd i{font-style:normal;color:#7fc78f;}
  .eqlab{display:inline-block;width:34px;color:#8b97a5;font-size:11px;}
  .eqhold{color:#e8c96a;}
  .eqdet .zd small{color:#6b7683;}
  .eqdet .zst .sb{padding:8px 12px;font-size:12.5px;}
  .eqdet .zst .trbuy{min-width:0;padding:6px 12px;}
  .zn em{font-style:normal;}
  /* 수련 패널 줄 */
  /* 배수 토글은 스크롤해도 위에 붙어 있는다 (스탯창 보기 불편 피드백) */
  .zst.tramt{position:sticky;top:44px;z-index:2;background:#12161c;
    margin:0;padding:9px 12px 8px;border-bottom:1px solid #1e242c;}
  .trow{display:flex;align-items:center;gap:10px;}
  .trl{flex:1;min-width:0;}
  .tico{width:36px;height:36px;flex:none;margin-right:8px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5));}
  .trv{display:block;margin-top:3px;color:#9fd0ff;font-weight:900;font-variant-numeric:tabular-nums;}
  .trv i{font-style:normal;color:#6b7683;font-weight:700;font-size:11px;}
  .trbuy{flex:0 0 auto;min-width:78px;background:#23303e;border:1.5px solid #3c6f9e;
    border-radius:9px;color:#cfe4f8;font:900 13.5px/1.35 var(--fb);padding:8px 10px;
    letter-spacing:.03em;font-variant-numeric:tabular-nums;}
  .trbuy i{font-style:normal;font-size:10px;color:#8fb4d8;display:block;}
  .trbuy:active{background:#2f5f8c;}
  .trbuy[disabled]{background:#171d25;border-color:#232b35;color:#57616d;}
  .trbuy[disabled] i{color:#48525d;}
  #trsilver{font-size:13px;color:#e8c96a;font-weight:900;font-variant-numeric:tabular-nums;}
  /* 무공 패널 — 문파별 타일 그리드 + 상세 칸 */
  .agrid{display:flex;flex-wrap:wrap;gap:6px;margin:4px 12px 0;}
  .atile{position:relative;width:56px;height:60px;border-radius:10px;border:1.5px solid #2c3540;
    background:#171d25;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;color:#9fb0c2;padding:4px 0 2px;overflow:hidden;}   /* v2.63.5 메달과 이름 사이 띄움("위로 붙어 있네") */
  .atile .sc{position:absolute;top:0;left:9px;right:9px;height:3px;border-radius:0 0 3px 3px;}
  .atile .g{font-size:17px;font-weight:900;}
  .atile .gi{width:26px;height:26px;border-radius:50%;display:block;margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.5);}
  .atile .se{position:absolute;right:3px;top:3px;width:13px;height:13px;border-radius:50%;opacity:.95;box-shadow:0 0 0 1px rgba(0,0,0,.6);}
  .atile .nm{font-size:9.5px;font-weight:800;color:#8b97a5;line-height:1.1;}
  /* 배움/안 배움을 확실히 가른다 — 익힌 건 문파색 바탕, 안 익힌 건 흑백(피드백) */
  .atile.got .nm{color:#cfe0f2;}
  .atile:not(.got) .g,.atile:not(.got) .gi{filter:grayscale(1);opacity:.55;}
  .atile.lock{opacity:.35;}
  .atile.fate{border-style:dashed;border-color:#8a6d2f;}
  .atile.sel{outline:2px solid #4a86bd;outline-offset:1px;}
  /* 우상단 배지 — ▲ 돌파 가능(금색) · + 배울 수 있음(청록) */
  .atile .bd{position:absolute;top:1px;right:3px;font-style:normal;font-size:9px;
    font-weight:900;line-height:1;display:none;}
  .atile .bd.up{display:block;color:#e8c96a;animation:bdp 1.1s ease-in-out infinite;}
  .atile .bd.can{display:block;color:#6fd3a8;}
  .atile .bd.lv{display:block;color:#69a8dd;}
  @keyframes bdp{50%{transform:scale(1.35);}}
  .adet{margin:10px 12px 4px;padding:10px 14px;background:#171d25;border:1.5px solid #3c6f9e;
    border-radius:11px;scroll-margin-bottom:14px;}
  .adet .trbuy{margin-top:8px;}
  /* ── 일반 스킬창 상단 — [초식][심법] 탭 + 심화 버튼 (v2.54) ── */
  #atabs{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;
    background:#12161c;padding:9px 12px 8px;border-bottom:1px solid #1e242c;}
  .askind{flex:0 0 auto;padding:6px 14px 5px;border-radius:999px;border:1.5px solid #3a4756;
    background:transparent;color:#8b95a3;font-family:var(--fw);font-size:13px;}
  .askind.on{background:#3c6f9e;border-color:#4a86bd;color:#eaf3ff;}
  #adeepen{margin-left:auto;padding:6px 13px 5px;border-radius:999px;
    border:1.5px solid #6a5aa0;background:linear-gradient(#241f36,#171423);
    color:#c9bdf0;font-family:var(--fw);font-size:13px;position:relative;}
  #adeepen .dot{position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;
    background:#e8c96a;display:none;box-shadow:0 0 5px #e8c96a;}
  #adeepen .dot.on{display:block;}
  /* ── 스킬 심화 패널 (v2.47 트리 → v2.54 심화창 → v2.55 [스킬 특성]/[문파 무공도] 두 갈래) ── */
  #dpanel.show .zsheet{max-height:92%;}
  /* 상단 고정 모드 바 — 토글 + 남은 무공점 */
  #dmode{position:sticky;top:0;z-index:4;height:44px;display:flex;align-items:center;gap:10px;
    background:#12161c;padding:0 14px;border-bottom:1px solid #1e242c;}
  #dmode .dmttl{font-family:var(--fw);font-size:15px;color:#e8eef6;letter-spacing:.03em;}
  #dmode .dmtabs{display:flex;gap:6px;}
  .dmb{padding:6px 13px 5px;border-radius:999px;border:1.5px solid #3a4756;background:transparent;
    color:#8b95a3;font-family:var(--fw);font-size:13px;white-space:nowrap;}
  .dmb.on{background:#6a5aa0;border-color:#8878c4;color:#f0ecff;}
  #dpts{margin-left:auto;font-family:var(--fw);font-size:12.5px;color:#9aa7b5;}
  #dpts b{color:#e8c96a;font-size:17px;font-variant-numeric:tabular-nums;margin-left:3px;}
  /* 스킬 특성 뷰 */
  .dempty{padding:40px 22px;text-align:center;color:#8b95a3;font-family:var(--fw);line-height:2;}
