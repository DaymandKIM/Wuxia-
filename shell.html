<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>무협</title>
<!-- 한글 게임 폰트 (v2.42): Jua=둥글고 친근한 제목·본문(메이플 느낌 대체),
     Do Hyeon=수치 폴백. 온라인이면 로드되고 오프라인이면 시스템 폰트로 대체된다.
     (v2.40의 붓글씨 Gugi는 "폰트 구림" 피드백으로 교체) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --fb:'Jua','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif; /* 본문·수치 */
    --fw:'Jua','Do Hyeon','Apple SD Gothic Neo',sans-serif;                       /* 제목 */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#05070a;overflow:hidden;
    font-family:var(--fb);
    -webkit-user-select:none;user-select:none;}
  #cv{position:fixed;display:block;image-rendering:pixelated;background:#0e1116;}
  #ui{position:fixed;pointer-events:none;overflow:hidden;}

  /* 상단 바 (v2.85, 사용자: "원경 위쪽에 안 쓰는 부분이 있네 거기 가리고 UI바 만들어" → "원경 가리지 말고") — 원경 그림 **위**
     빈자리를 불투명 띠로 덮고 HUD를 그 안에 넣는다. 그림은 50-render backdropTop이 바 아래로 내려 그린다(안 가림).
     오른쪽 ≡ 버튼이 메뉴(설정·업적)를 접었다 편다.
     v2.84의 얇은 HUD(제목 · 체력바 7px · 수련 바 3px · 경지·은자 줄)는 그대로 띠 안으로. */
  #topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px 12px;
    display:flex;align-items:center;gap:8px;pointer-events:none;transition:opacity .22s;
    background:linear-gradient(#1a2028,#10141a);border-bottom:1.5px solid #2b333d;
    box-shadow:0 2px 8px rgba(0,0,0,.45);}
  #card{flex:1;min-width:0;background:none;border:0;padding:0;
    text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.6);}
  .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;
    font-family:var(--fw);font-size:15px;color:#f2f6fb;letter-spacing:.03em;}
  .row1 #kills{font-size:12.5px;color:#d7e2ee;font-variant-numeric:tabular-nums;}
  .row2{display:flex;justify-content:space-between;align-items:center;margin-top:4px;
    font-size:12px;font-weight:900;letter-spacing:.03em;}
  .row2 #realm{color:#b9dcff;pointer-events:auto;cursor:pointer;
    border-bottom:1px dotted rgba(185,220,255,.55);padding-bottom:1px;}
  .row2 #silver{color:#f0d078;font-variant-numeric:tabular-nums;display:flex;
    align-items:center;gap:4px;}
  .coin{width:12px;height:12px;image-rendering:pixelated;vertical-align:-2px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.8));}
  .bar{position:relative;height:7px;margin-bottom:3px;border-radius:4px;overflow:hidden;
    background:rgba(8,10,14,.55);border:0;box-shadow:0 0 0 1px rgba(0,0,0,.45);}
  .bar>i{display:block;height:100%;width:0%;transition:width .12s linear;}
  #hp{height:11px;}   /* 7px엔 8.5px 글자가 잘렸다 (v2.88.1 "글씨 짤림") — 11px 바 + 9px 글자 */
  #hp>i{background:linear-gradient(90deg,#c8453c,#e0655a);}
  #kn{height:3px;margin-bottom:0;}
  #kn>i{background:linear-gradient(90deg,#3f7fb8,#69a8dd);}
  .bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;line-height:1;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95);letter-spacing:.04em;}
  /* ≡ 버튼 — 세 줄. 열리면 ✕ 로 */
  #menubtn{pointer-events:auto;flex:none;width:40px;height:40px;border-radius:10px;border:1.5px solid #2b333d;
    background:#0e1319;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;}
  #menubtn i{display:block;width:18px;height:2px;border-radius:1px;background:#cfe0f2;transition:transform .18s,opacity .18s;}
  #menubtn:active{background:#1c2430;}
  #menubtn.on i:nth-child(1){transform:translateY(6px) rotate(45deg);}
  #menubtn.on i:nth-child(2){opacity:0;}
  #menubtn.on i:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
  /* 메뉴 — 바 아래 오른쪽에서 접혔다 펴진다. 바깥을 누르면 닫힘 */
  #mpanel{position:absolute;inset:0 0 var(--tabh) 0;pointer-events:none;overflow:hidden;z-index:30;
    background:rgba(6,8,11,0);transition:background .2s;}
  #mpanel.show{pointer-events:auto;background:rgba(6,8,11,.55);}
  .msheet{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 70px);width:210px;
    background:#12161c;border:1.5px solid #2b333d;border-radius:12px;padding:6px;
    transform:translateY(-10px) scale(.96);transform-origin:top right;opacity:0;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),opacity .18s;box-shadow:0 8px 24px rgba(0,0,0,.55);}
  #mpanel.show .msheet{transform:none;opacity:1;}
  .mhd{font-size:10.5px;color:#7f8b99;letter-spacing:.08em;padding:6px 10px 3px;}
  .mi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    background:none;border:0;color:#e6eef8;font:inherit;font-size:13.5px;font-weight:900;
    padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;}
  .mi:active{background:#1c2430;}
  .mi .mv{color:#8b97a5;font-size:12px;font-weight:700;}
  .mi.on .mv{color:#8fe3a1;}
  .mi:disabled{opacity:.5;cursor:default;}
  .msep{height:1px;background:#1e242c;margin:4px 6px;}
  .mi.bad .mv{color:#e08a7a;}   /* 저장소 막힘 (v2.90.2) */
  /* 저장 코드 시트 (v2.90.2, "저장이 안 됨") — 글상자에 코드, [복사]·[불러오기] */
  #ctext{display:block;width:calc(100% - 24px);margin:6px 12px 0;height:96px;resize:none;padding:8px 10px;border-radius:9px;
    border:1.5px solid #2b333d;background:#0e1319;color:#cfe0f2;font:11px/1.45 monospace;word-break:break-all;
    -webkit-user-select:text;user-select:text;}
  #cnote{white-space:pre-line;}
  .cbtns{display:flex;gap:6px;margin:8px 12px 4px;}
  .cbtns .trbuy{flex:1;padding:10px 0;}
  #menubtn{position:relative;}
  #menudot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#e8c96a;box-shadow:0 0 6px #e8c96a;display:none;}
  #menudot.on{display:block;}
  /* 업적 패널 (v2.90) — 카드: 이름·별(받음 ★ / 달성 ☆ / 남음 ·)·진행 바·받기 버튼. 받을 것은 금색 테두리 */
  .acard{display:flex;align-items:center;gap:10px;margin:8px 12px;padding:10px 12px;background:#171d25;border:1.5px solid #232b35;border-radius:11px;}
  .acard.can{border-color:#e8c96a;box-shadow:0 0 10px #e8c96a33;}
  .acard.done{opacity:.6;}
  .atxt{flex:1;min-width:0;}
  .atxt .zn small{font-size:11px;color:#e8c96a;letter-spacing:.12em;margin-left:6px;font-family:var(--fb);}
  .atxt .zd i{font-style:normal;color:#cfe0f2;}
  .abar{height:5px;margin-top:7px;border-radius:3px;background:#0e1319;overflow:hidden;}
  .abar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d2f,#e8c96a);}
  .abtn{flex:none;min-width:96px;padding:7px 8px;font-size:12px;}
  .abtn:disabled{opacity:.42;}
  .adone{flex:none;font-size:12px;color:#8fe3a1;font-weight:900;padding:0 8px;}
  /* 문파 패널 (v2.91) — 전각 카드(업적 카드 재사용) + 전각 그림 액자(없으면 한자) + 명성 띠 */
  .hcard .hico{flex:none;width:46px;height:46px;border-radius:10px;background:#0e1319;border:1.5px solid #2b333d;display:flex;align-items:center;justify-content:center;}
  .hcard .hico img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated;}
  .hcard .hico b{font-family:'Nanum Myeongjo',serif;font-size:22px;color:#7fc78f;}
  /* 전각 그림이 없을 땐 낙관 도장 — 붉은 인장 위 흰 한자 (v2.91.1, 사용자 "이미지는 없으니 아이콘 등으로 일단") */
  .hcard .hico.seal{background:linear-gradient(135deg,#b3392e,#8a2a22);border:2px solid #d9a066;border-radius:7px;
    box-shadow:inset 0 0 0 2px #6e1f19,inset 0 0 12px rgba(0,0,0,.35),0 2px 5px rgba(0,0,0,.5);transform:rotate(-4deg);}
  .hcard .hico.seal b{color:#fff1dc;font-size:24px;text-shadow:0 1px 0 #5a1712;letter-spacing:-.02em;}
  #tab-sect .ti{border-radius:50%;}
  .hcard .zn em{font-style:normal;font-size:11px;color:#69a8dd;margin-left:4px;}
  .hcard .zd i{font-style:normal;color:#7fc78f;}
  .hcard.can{border-color:#7fc78f;box-shadow:0 0 10px #7fc78f33;}
  .zrow.fame{border-color:#3d5a3f;} .zrow.fame .zn em{font-style:normal;color:#7fc78f;font-size:14px;margin-left:6px;}
  .zhd small{font-family:'Nanum Myeongjo',serif;font-size:11px;color:#7f8b99;margin-left:6px;font-weight:400;}
  #ssilver{margin-left:auto;margin-right:8px;font-size:13px;color:#e8c96a;}
  #sedit{font-size:14px;color:#7f8b99;padding:2px 6px;margin-left:2px;}
  /* 문파 터 화면 (v2.92) — 시트는 아래 절반만, 위엔 마당이 보인다 */
  #spanel{background:rgba(6,8,11,0) !important;}
  #spanel .zsheet{height:36%;}   /* v2.92.1 전각 카드가 팝업으로 나가 시트는 얇게 — 마당이 더 보인다 */
  /* 문파 마당 오버레이 (v2.92.4, 사용자 "여전히 아래 탭이 열리네") — 탭을 열면 시트 없이 마당만. 현판(이름·✎·✕)과 배지 둘(명성·제자), 배지를 누르면 시트 */
  #sover{position:absolute;inset:var(--toph,0px) 0 var(--tabh) 0;pointer-events:none;z-index:20;}
  #sover[hidden]{display:none;}
  #splaque{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;pointer-events:auto;
    background:linear-gradient(#3a2a1c,#241a10);border:2px solid #d9a066;border-radius:8px;padding:5px 10px 5px 14px;box-shadow:0 3px 10px rgba(0,0,0,.6);}
  #splaque b{font-family:var(--fw);font-size:17px;color:#f0e2b8;letter-spacing:.06em;}
  #splaque small{font-family:'Nanum Myeongjo',serif;font-size:11px;color:#c9a66b;}
  #splaque button{background:none;border:0;color:#c9a66b;font-size:14px;padding:2px 5px;}
  #sfame,#sdisc{position:absolute;bottom:12px;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:132px;
    background:rgba(18,22,28,.9);border:1.5px solid #3d5a3f;border-radius:10px;padding:7px 10px;color:#cfe0f2;font:inherit;text-align:left;}
  #sfame{left:10px;} #sdisc{right:10px;align-items:flex-end;}
  #sover .sfl{font-size:10px;color:#7f8b99;letter-spacing:.08em;}
  #sover b{font-family:var(--fw);font-size:14px;color:#7fc78f;}
  #sover span:not(.sfl){font-size:11px;color:#9aa7b5;}
  #sover .sbar{display:block;width:100%;height:4px;border-radius:2px;background:#0e1319;overflow:hidden;margin-top:3px;}
  #sover .sbar u{display:block;height:100%;background:linear-gradient(90deg,#8a6d2f,#e8c96a);}
  /* 전각 팝업 (v2.92.1) — 마당 위에 뜨는 작은 카드 */
  #hpop{position:absolute;z-index:35;pointer-events:auto;width:268px;padding:9px 10px 9px 10px;background:rgba(18,22,28,.96);border:1.5px solid #7fc78f;
    border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;}
  #hpop[hidden]{display:none;}
  #hpop .hpico{width:40px;height:40px;border-radius:9px;background:#0e1319;border:1.5px solid #2b333d;display:flex;align-items:center;justify-content:center;grid-row:1 / span 2;}
  #hpop .hpico.seal{background:linear-gradient(135deg,#b3392e,#8a2a22);border:2px solid #d9a066;border-radius:7px;box-shadow:inset 0 0 0 2px #6e1f19;transform:rotate(-4deg);}
  #hpop .hpico b{font-family:'Nanum Myeongjo',serif;font-size:21px;color:#fff1dc;}
  #hpop .hpico img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated;}
  #hpop .zn{font-size:15px;padding-right:22px;} #hpop .zn small{color:#e8c96a;font-size:10px;} #hpop .zn em{font-style:normal;font-size:11px;color:#69a8dd;margin-left:4px;}
  #hpop .zd{font-size:11.5px;margin-top:0;height:51px;line-height:17px;white-space:nowrap;overflow:hidden;}   /* 효과 줄 높이 고정 — 올릴 때마다 [올리기] 버튼이 안 움직인다 (v2.93.5) */ #hpop .zd i{font-style:normal;color:#7fc78f;}
  #hpop .trbuy{grid-column:1 / span 2;padding:9px 0;font-size:13px;}
  #hpop .trbuy i{display:inline;margin-left:6px;font-size:12px;}
  #hpclose{position:absolute;right:4px;top:2px;background:none;border:0;color:#7f8b99;font-size:16px;padding:4px 8px;}
  .acard.flash{border-color:#ffe08a;box-shadow:0 0 14px #ffe08a88;}
  .zrow.drow{border-color:#3d5a3f;}
  .drow .zn em{font-style:normal;color:#7fc78f;font-size:13px;margin-left:6px;}
  .dlist{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
  .dline{display:flex;align-items:center;gap:8px;font-size:12px;color:#9aa7b5;}
  .dline .dsch{flex:none;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);}
  .dline b{color:#e8eef6;font-family:var(--fw);font-size:14px;}
  .dline em{margin-left:auto;font-style:normal;color:#7fc78f;font-size:11.5px;white-space:nowrap;}
  .drow .zd i{font-style:normal;color:#e8c96a;}
  /* 문파 이름 짓기 줄 (v2.91.2) */
  .snamerow{border-color:#3d5a3f;}
  .snamein{display:flex;gap:6px;margin-top:9px;}
  .snamein input{flex:1;min-width:0;background:#0e1319;border:1.5px solid #2b333d;border-radius:9px;color:#eaf3ff;font:15px var(--fw);padding:9px 12px;
    -webkit-user-select:text;user-select:text;}
  .snamein input:focus{outline:none;border-color:#7fc78f;}
  .snamein .trbuy{flex:0 0 auto;padding:9px 16px;}

  /* 하단 탭바 — 기능이 들어올 때마다 탭이 하나씩 는다 */
  #ui{--tabh:calc(env(safe-area-inset-bottom) + 52px);}
  #tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);
    padding-bottom:env(safe-area-inset-bottom);display:flex;pointer-events:auto;
    background:rgba(13,16,21,.96);border-top:1.5px solid #262e38;transition:opacity .22s;}
  #tabs button{flex:1;position:relative;background:none;border:0;color:#7f8b99;
    font:400 12px/1 var(--fw);letter-spacing:.06em;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;}
  /* 탭 아이콘 (v2.63.4) — 안 켜진 탭은 흐리게, 켜지면 또렷하게 */
  #tabs button .ti{width:26px;height:26px;object-fit:contain;opacity:.55;filter:saturate(.6);transition:opacity .15s;}
  #tabs button.on{color:#eaf3ff;}
  #tabs button.on .ti{opacity:1;filter:none;}
  #tabs button .dot{position:absolute;top:9px;right:calc(50% - 24px);width:6px;height:6px;
    border-radius:50%;background:#e8c96a;display:none;}
  #tabs button .dot.on{display:block;}
  /* [테스트 전용] 시험 버튼·패널 — TEST 끄면 안 보인다. 출시 전에 걷어낸다 */
  /* 스킬창 — 익힌 초식의 쿨다운 표시 (자동 시전이라 누르는 게 아니다).
     버튼이 아니라 "기운이 차는 원판"처럼 보이게: 둥근 원, 눌리는 테두리 없음.
     쿨 도는 동안엔 초 숫자만 크게, 다 차면 한자 글자가 밝아진다 (겹침 방지). */
  /* 스킬 툴팁 (v2.63.6) — 스킬창 바로 위 */
  #stip{position:absolute;right:10px;bottom:calc(var(--tabh) + 58px);max-width:230px;pointer-events:none;
    background:rgba(13,16,21,.94);border:1.5px solid #3d5a7a;border-radius:9px;padding:7px 10px;
    font-size:11.5px;line-height:1.5;color:#c9d6e3;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;}
  #stip.show{opacity:1;transform:none;}
  #stip b{font-family:var(--fw);font-size:14px;color:#eaf3ff;letter-spacing:.04em;}
  #stip i{font-style:normal;color:#8b97a5;font-size:11px;}
  #stip .stfx{color:#9fd0ff;margin-top:2px;}
  #sbar{position:absolute;right:10px;bottom:calc(var(--tabh) + 10px);display:flex;gap:7px;
    align-items:flex-end;transition:opacity .22s;pointer-events:none;}
  /* 오토/수동 토글 — 스킬창 왼쪽 끝. 패널이 감춰도 늘 누를 수 있다 (v2.51 단장) */
  #sbar .smode{pointer-events:auto;align-self:flex-end;height:40px;padding:0 13px;
    display:flex;align-items:center;gap:6px;border-radius:20px;
    border:1.5px solid rgba(120,140,165,.32);background:linear-gradient(#1b232e,#12161c);
    color:#a9bccf;font:800 12px/1 inherit;letter-spacing:.04em;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.42);transition:color .15s,border-color .15s,box-shadow .15s;}
  #sbar .smode::before{content:'';width:7px;height:7px;border-radius:50%;
    background:currentColor;box-shadow:0 0 5px currentColor;opacity:.9;}
  /* v2.85 (사용자: "자동일 때 불이 들어오게") — 자동 = 초록 발광(켜짐), 수동 = 회색 + 꺼진 점. 옛 호박색 수동은 폐기 */
  #sbar .smode.auto{border-color:#5fcf7f;color:#b4f2c4;background:linear-gradient(#17301f,#0f1b14);
    box-shadow:0 0 10px rgba(95,207,127,.38),0 2px 6px rgba(0,0,0,.42);}
  #sbar .smode.auto::before{background:#8fe89f;box-shadow:0 0 6px 1px #8fe89f;opacity:1;animation:smpulse 1.8s ease-in-out infinite;}
  @keyframes smpulse{0%,100%{box-shadow:0 0 6px 1px #8fe89f;}50%{box-shadow:0 0 10px 3px #8fe89f;}}
  @media (prefers-reduced-motion: reduce){#sbar .smode.auto::before{animation:none;}}
  #sbar .smode.man{color:#8b97a5;}
  #sbar .smode.man::before{background:#4a5563;box-shadow:none;opacity:.8;}
  /* 초식 슬롯 — 입체 원판. 쿨은 시계 방향 원형 스윕, 준비되면 문파색 발광 */
  .sk{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;
